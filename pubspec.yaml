name: medicreminder
description: Aplicativo de lembretes de medicação
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.0
  flutter_local_notifications: ^17.0.0
  timezone: 0.9.4
  go_router: ^12.0.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  supabase_flutter: ^2.12.0
  image_picker: ^1.0.7
  connectivity_plus: ^7.0.0
  url_launcher: ^6.2.5
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcheer_icon"
  image_path: "assets/icons/Logo.png"
  min_sdk_android: 21

  flutter_lints: ^2.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/Logo.png